  <!-- Script para inyectar los partials y mantener la lógica de la web -->
  <script>
    async function loadComponent(id, file) {
      try {
        const response = await fetch(file);
        if (response.ok) {
          document.getElementById(id).innerHTML = await response.text();
        }
      } catch (error) {
        console.error(`Error cargando ${file}:`, error);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await loadComponent("include-header", "assets/partials/header.html");
      await loadComponent("include-hero", "assets/partials/hero.html");
      await loadComponent("include-servicios", "assets/partials/servicios.html");
      await loadComponent("include-proceso", "assets/partials/proceso.html");
      await loadComponent("include-local", "assets/partials/local.html");
      await loadComponent("include-preguntas", "assets/partials/preguntas.html");
      await loadComponent("include-contacto", "assets/partials/contacto.html");
      await loadComponent("include-footer", "assets/partials/footer.html");
      await loadComponent("include-whatsapp", "assets/partials/whatsapp.html");

      // Cargar el script de JS y arrancar la lógica cuando el HTML ya esté completo
      const mainScript = document.createElement("script");
      mainScript.src = "assets/js/main.js";
      mainScript.onload = () => {
        if (typeof initMainScript === "function") {
